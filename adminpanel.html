<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - Moj Web</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0f12;
            color: white;
        }

        header {
            background: #18181d;
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #292930;
        }

        header h1 {
            font-size: 30px;
        }

        header p {
            color: #aaa;
            margin-top: 8px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        .panel {
            background: #19191f;
            border: 1px solid #292930;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .panel h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #ccc;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #33333b;
            border-radius: 8px;
            background: #101014;
            color: white;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            background: #ff3333;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        button:hover {
            background: #e52222;
        }

        .secondary {
            background: #303038;
        }

        .secondary:hover {
            background: #41414b;
        }

        .danger {
            background: #8b1e1e;
        }

        .danger:hover {
            background: #b52525;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #202027;
            color: #aaa;
        }

        .video-box {
            border: 1px solid #33333b;
            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
            background: #111116;
        }

        .video-box h3 {
            margin-bottom: 8px;
        }

        .video-box p {
            color: #aaa;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .login-box {
            max-width: 500px;
            margin: 70px auto;
            padding: 30px;
            background: #19191f;
            border: 1px solid #292930;
            border-radius: 15px;
        }

        .login-box h1 {
            margin-bottom: 10px;
            text-align: center;
        }

        .login-box p {
            color: #aaa;
            text-align: center;
            margin-bottom: 25px;
        }

        .thumbnail-preview {
            display: none;
            width: 100%;
            max-width: 400px;
            max-height: 220px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 5px;
            margin-bottom: 18px;
            border: 1px solid #33333b;
        }

        .file-name {
            color: #aaa;
            margin-top: -8px;
            margin-bottom: 18px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="login-box">

        <h1>🔐 Admin Login</h1>

        <p>Prijavi se u svoj Moj Web admin panel.</p>

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Tvoj email">

        <label>Lozinka</label>

        <input
            type="password"
            id="password"
            placeholder="Tvoja lozinka">

        <button onclick="login()">
            🔑 Prijava
        </button>

        <div id="loginMessage" class="message"></div>

    </div>

</div>


<!-- ADMIN PANEL -->

<div id="adminScreen" class="hidden">

    <header>

        <h1>⚙️ Admin Panel</h1>

        <p>Upravljanje mojom web stranicom</p>

        <br>

        <button class="secondary" onclick="logout()">
            🚪 Odjava
        </button>

    </header>


    <div class="container">
                <!-- SETTINGS -->

        <div class="panel">

            <h2>🌐 Postavke web stranice</h2>

            <label>Naslov web stranice</label>

            <input
                type="text"
                id="siteTitle"
                placeholder="Moj Web">

            <label>Opis web stranice</label>

            <textarea
                id="siteDescription"
                placeholder="Roblox gaming i još mnogo toga."></textarea>

            <button onclick="saveSettings()">
                💾 Spremi postavke
            </button>

            <div id="settingsMessage" class="message"></div>

        </div>


        <!-- ADD VIDEO -->

        <div class="panel">

            <h2>🎬 Dodaj novi video</h2>

            <label>Naslov videa</label>

            <input
                type="text"
                id="videoTitle"
                placeholder="Npr. Roblox Studio Tutorial">

            <label>YouTube link</label>

            <input
                type="text"
                id="videoLink"
                placeholder="https://www.youtube.com/watch?v=...">

            <label>🖼️ Thumbnail</label>

            <input
                type="file"
                id="thumbnailFile"
                accept="image/png,image/jpeg,image/webp"
                onchange="previewThumbnail()">

            <div class="file-name" id="thumbnailFileName">
                Nije odabrana slika
            </div>

            <img
                id="thumbnailPreview"
                class="thumbnail-preview"
                alt="Thumbnail preview">

            <label>Thumbnail URL</label>

            <input
                type="text"
                id="videoThumbnail"
                placeholder="https://...">

            <label>Opis videa</label>

            <textarea
                id="videoDescription"
                placeholder="Opis videa"></textarea>

            <label>Roblox skripta</label>

            <textarea
                id="videoScript"
                placeholder="Ovdje stavi Roblox skriptu..."></textarea>

            <label>Koraci</label>

            <textarea
                id="videoSteps"
                placeholder="1. Otvori Roblox Studio&#10;2. Napravi Part&#10;3. Dodaj Script"></textarea>

            <button onclick="addVideo()">
                ➕ Dodaj video
            </button>

            <button class="secondary" onclick="clearForm()">
                🗑️ Očisti
            </button>

            <div id="videoMessage" class="message"></div>

        </div>


        <!-- VIDEOS -->

        <div class="panel">

            <h2>📹 Moji videi</h2>

            <div id="videoList">
                Učitavanje...
            </div>

        </div>

    </div>


    <footer>
        Admin Panel • Moj Web
    </footer>

</div>
<!-- FIREBASE -->

<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        addDoc,
        deleteDoc,
        doc,
        setDoc,
        getDoc,
        onSnapshot
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {
        apiKey: "AIzaSyAP2yePMtk2SlQju1cHGc3jhMiq42Mzxdo",
        authDomain: "moj-web-ec4c7.firebaseapp.com",
        projectId: "moj-web-ec4c7",
        storageBucket: "moj-web-ec4c7.firebasestorage.app",
        messagingSenderId: "341511464392",
        appId: "1:341511464392:web:4aa2988f8aa61f257c8cfd"
    };


    // ==========================================
    // START FIREBASE
    // ==========================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // ==========================================
    // LOGIN
    // ==========================================

    window.login = async function() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("loginMessage");


        if (!email || !password) {

            message.textContent =
                "Upiši email i lozinku.";

            return;
        }


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            message.textContent =
                "Prijava uspješna!";

        } catch (error) {

            console.error(error);

            message.textContent =
                "Greška: " + error.message;
        }
    };


    // ==========================================
    // LOGOUT
    // ==========================================

    window.logout = async function() {

        await signOut(auth);

    };


    // ==========================================
    // AUTH STATE
    // ==========================================

    onAuthStateChanged(auth, function(user) {

        const loginScreen =
            document.getElementById("loginScreen");

        const adminScreen =
            document.getElementById("adminScreen");


        if (user) {

            loginScreen.classList.add("hidden");

            adminScreen.classList.remove("hidden");

            loadSettings();

            loadVideos();

        } else {

            loginScreen.classList.remove("hidden");

            adminScreen.classList.add("hidden");

        }

    });


    // ==========================================
    // SAVE SETTINGS
    // ==========================================

    window.saveSettings = async function() {

        const title =
            document.getElementById("siteTitle").value.trim();

        const description =
            document.getElementById("siteDescription").value.trim();

        const message =
            document.getElementById("settingsMessage");


        if (!title) {

            message.textContent =
                "Upiši naslov web stranice!";

            return;
        }


        try {

            await setDoc(
                doc(db, "settings", "website"),
                {
                    title: title,
                    description: description
                }
            );


            message.textContent =
                "✅ Postavke su spremljene!";

        } catch (error) {

            console.error(error);

            message.textContent =
                "❌ Greška pri spremanju: " +
                error.message;
        }
    };


    // ==========================================
    // LOAD SETTINGS
    // ==========================================

    async function loadSettings() {

        try {

            const settingsRef =
                doc(db, "settings", "website");

            const settingsSnap =
                await getDoc(settingsRef);


            if (settingsSnap.exists()) {

                const data =
                    settingsSnap.data();

                document.getElementById("siteTitle").value =
                    data.title || "";

                document.getElementById("siteDescription").value =
                    data.description || "";
            }

        } catch (error) {

            console.error(error);
        }
    };


    // ==========================================
    // THUMBNAIL PREVIEW
    // ==========================================

    window.previewThumbnail = function() {

        const fileInput =
            document.getElementById("thumbnailFile");

        const preview =
            document.getElementById("thumbnailPreview");

        const fileName =
            document.getElementById("thumbnailFileName");


        if (!fileInput.files || !fileInput.files[0]) {

            preview.style.display = "none";

            fileName.textContent =
                "Nije odabrana slika";

            return;
        }


        const file =
            fileInput.files[0];


        if (!file.type.startsWith("image/")) {

            fileName.textContent =
                "❌ Odaberi sliku!";

            preview.style.display = "none";

            return;
        }


        fileName.textContent =
            "📁 " + file.name;


        const imageURL =
            URL.createObjectURL(file);


        preview.src =
            imageURL;

        preview.style.display =
            "block";
    };


    // ==========================================
    // ADD VIDEO
    // ==========================================

    window.addVideo = async function() {

        const title =
            document.getElementById("videoTitle").value.trim();

        const link =
            document.getElementById("videoLink").value.trim();

        const thumbnail =
            document.getElementById("videoThumbnail").value.trim();

        const description =
            document.getElementById("videoDescription").value.trim();

        const script =
            document.getElementById("videoScript").value;

        const steps =
            document.getElementById("videoSteps").value;


        const message =
            document.getElementById("videoMessage");


        if (!title || !link) {

            message.textContent =
                "❌ Upiši naslov i YouTube link.";

            return;
        }


        try {

            await addDoc(
                collection(db, "videos"),
                {
                    title: title,
                    link: link,
                    thumbnail: thumbnail,
                    description: description,
                    script: script,
                    steps: steps,
                    createdAt: Date.now()
                }
            );


            message.textContent =
                "✅ Video je dodan!";

            clearForm();

        } catch (error) {

            console.error(error);

            message.textContent =
                "❌ Greška: " + error.message;
        }

    };
        // ==========================================
    // CLEAR FORM
    // ==========================================

    window.clearForm = function() {

        document.getElementById("videoTitle").value = "";

        document.getElementById("videoLink").value = "";

        document.getElementById("videoThumbnail").value = "";

        document.getElementById("videoDescription").value = "";

        document.getElementById("videoScript").value = "";

        document.getElementById("videoSteps").value = "";

        document.getElementById("thumbnailFile").value = "";

        document.getElementById("thumbnailFileName").textContent =
            "Nije odabrana slika";

        document.getElementById("thumbnailPreview").style.display =
            "none";

        document.getElementById("thumbnailPreview").src = "";
    };


    // ==========================================
    // LOAD VIDEOS
    // ==========================================

    function loadVideos() {

        const list =
            document.getElementById("videoList");


        onSnapshot(
            collection(db, "videos"),
            function(snapshot) {

                list.innerHTML = "";


                if (snapshot.empty) {

                    list.innerHTML =
                        "<p>Nema videa.</p>";

                    return;
                }


                snapshot.forEach(function(videoDoc) {

                    const video =
                        videoDoc.data();

                    const id =
                        videoDoc.id;


                    const box =
                        document.createElement("div");

                    box.className =
                        "video-box";


                    box.innerHTML = `

                        <h3>
                            🎬 ${escapeHtml(video.title || "")}
                        </h3>

                        <p>
                            ${escapeHtml(video.description || "")}
                        </p>

                        <button
                            class="danger"
                            onclick="deleteVideo('${id}')">

                            🗑️ Obriši

                        </button>

                    `;


                    list.appendChild(box);

                });

            },
            function(error) {

                console.error(error);

                list.innerHTML =
                    "<p>❌ Greška pri učitavanju videa.</p>";
            }
        );

    }


    // ==========================================
    // DELETE VIDEO
    // ==========================================

    window.deleteVideo = async function(id) {

        if (!confirm("Želiš li obrisati ovaj video?")) {
            return;
        }


        try {

            await deleteDoc(
                doc(db, "videos", id)
            );

        } catch (error) {

            console.error(error);

            alert(
                "Greška: " + error.message
            );

        }

    };


    // ==========================================
    // SECURITY FOR DISPLAYED TEXT
    // ==========================================

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text;

        return div.innerHTML;

    }

</script>

</body>
</html>
